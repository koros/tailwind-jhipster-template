sonar.projectKey=myTailwindJhipster
sonar.projectName=myTailwindJhipster

# Source code - only include directories that exist
sonar.sources=client,server
sonar.tests=client,server

# Test inclusions
sonar.test.inclusions=server/src/test/**/*.*,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# SonarQube Server
sonar.host.url=http://localhost:9001

# Code Coverage - JavaScript/TypeScript
# Uncomment these lines after running tests to get coverage data
sonar.javascript.lcov.reportPaths=target/test-results/lcov.info
# sonar.testExecutionReportPaths=target/test-results/jest/TESTS-results-sonar.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  client/i18n/**/*.*,\
  target/**/*.*,\
  node_modules/**/*.*,\
  server/dist/**/*.*,\
  server/node_modules/**/*.*,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx

# JavaScript/TypeScript specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Explicit language patterns to avoid conflicts
sonar.lang.patterns.js=**/*.js,**/*.jsx
sonar.lang.patterns.ts=**/*.ts,**/*.tsx

# Ignore certain rules for development
sonar.issue.ignore.multicriteria=S6437,S1192,S125,S2187,S2699,UndocumentedApi

# Rule S2699 - Tests without assertions (FALSE POSITIVES)
# Many tests DO have assertions but SonarQube doesn't detect them in callback patterns
sonar.issue.ignore.multicriteria.S2699.resourceKey=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.issue.ignore.multicriteria.S2699.ruleKey=typescript:S2699

# Rule S6437 - Hardcoded passwords are provided for development purposes
sonar.issue.ignore.multicriteria.S6437.resourceKey=server/src/config/**/*
sonar.issue.ignore.multicriteria.S6437.ruleKey=typescript:S6437

# Rule S1192 - Duplicated strings
sonar.issue.ignore.multicriteria.S1192.resourceKey=server/src/**/*
sonar.issue.ignore.multicriteria.S1192.ruleKey=typescript:S1192

# Rule S125 - Commented code
sonar.issue.ignore.multicriteria.S125.resourceKey=src/**/*
sonar.issue.ignore.multicriteria.S125.ruleKey=typescript:S125

# Rule S2187 - No tests
sonar.issue.ignore.multicriteria.S2187.resourceKey=src/test/**/*
sonar.issue.ignore.multicriteria.S2187.ruleKey=typescript:S2187

# Undocumented API
sonar.issue.ignore.multicriteria.UndocumentedApi.resourceKey=server/src/**/*
sonar.issue.ignore.multicriteria.UndocumentedApi.ruleKey=typescript:UndocumentedApi
